name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      # The rebuild is offline and deterministic: committed output must match it exactly.
      - run: npm run rebuild
      - name: Rebuild changed no file
        run: |
          git status --porcelain
          git --no-pager diff --stat
          test -z "$(git status --porcelain)"
