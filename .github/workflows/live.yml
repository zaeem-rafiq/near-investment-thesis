name: Daily public live snapshot

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-live-snapshot
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Read public sources and daily 1Click flow
        env:
          NEAR_INTENTS_JWT: ${{ secrets.NEAR_INTENTS_JWT }}
        run: node scripts/live.mjs
      - name: Commit only live.json if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const path = 'dashboard/live.json';
          const content = await readFile(path);
          const repository = process.env.GITHUB_REPOSITORY;
          const branch = process.env.DEFAULT_BRANCH;
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository) || !branch) {
            throw Error('Invalid repository context.');
          }
          const endpoint = `https://api.github.com/repos/${repository}/contents/${path}`;
          const headers = { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const response = await fetch(`${endpoint}?ref=${encodeURIComponent(branch)}`, {
            headers, redirect: 'error', signal: AbortSignal.timeout(30000)
          });
          if (!response.ok && response.status !== 404) throw Error(`Snapshot lookup failed: HTTP ${response.status}.`);
          const remote = response.status === 404 ? null : await response.json();
          if (remote && (remote.type !== 'file' || remote.encoding !== 'base64')) throw Error('Unexpected remote file type.');
          if (remote && Buffer.from(remote.content, 'base64').equals(content)) {
            console.log('No live.json change; no commit.');
          } else {
            let expected = null;
            try {
              expected = execFileSync('git', ['rev-parse', `HEAD:${path}`],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trim();
            } catch {}
            if ((remote?.sha ?? null) !== expected) throw Error('Live snapshot changed since checkout; rerun without overwriting it.');
            const result = await fetch(endpoint, {
              method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' },
              redirect: 'error', signal: AbortSignal.timeout(30000),
              body: JSON.stringify({
                message: 'Update daily live snapshot\n\nCo-authored-by: factory-droid[bot] <138933559+factory-droid[bot]@users.noreply.github.com>',
                content: content.toString('base64'), branch, ...(remote ? { sha: remote.sha } : {})
              })
            });
            if (!result.ok) throw Error(`Snapshot commit failed: HTTP ${result.status}.`);
            console.log('Committed dashboard/live.json only.');
          }
          JS
